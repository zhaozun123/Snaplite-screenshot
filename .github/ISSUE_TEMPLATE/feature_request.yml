name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 先说遇到什么不方便的地方，比直接提功能更容易达成共识
      placeholder: 画笔画完以后没办法单独选中删除，只能整体撤销
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你设想的使用方式或界面
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 可选

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 该功能不与现有标注工具（画笔 / 马赛克 / 箭头）的定位冲突
